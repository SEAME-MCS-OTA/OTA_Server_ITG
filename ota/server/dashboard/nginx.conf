server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2g;

    location /api/ {
        proxy_pass http://ota_gh_server:8080;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://ota_gh_server:8080;
        proxy_set_header Host $host;
    }

    location /monitoring/ {
        proxy_pass http://ota_gh_monitoring_backend:4000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
